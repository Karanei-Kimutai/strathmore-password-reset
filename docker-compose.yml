version: '3.8'

services:
  strathmore-password-reset:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strathmore-pwd-reset
    volumes:
      # Mount passwords directory to persist logs
      - ./passwords:/app/passwords
    env_file:
      - .env
    environment:
      # Override any env vars here if needed
      - TZ=Africa/Nairobi
    restart: "no"  # Change to "always" for scheduled runs
    
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

