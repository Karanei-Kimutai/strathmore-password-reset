services:
  strathmore-password-reset:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strathmore-pwd-reset
    volumes:
      # Mount the local passwords directory into the container to save logs
      - ./passwords:/app/passwords
    env_file:
      # Load credentials from your local .env file
      - .env
    environment:
      # This flag tells the script it's inside a Docker container
      - RUNNING_IN_DOCKER=true
      # Set the container's timezone
      - TZ=Africa/Nairobi
    restart: "no"  # This ensures the container runs once and then stops

    # Optional: You can uncomment these lines to limit CPU and memory usage
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M